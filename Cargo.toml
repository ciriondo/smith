[workspace]
resolver = "2"
members = [
    "crates/smith-core",
    "crates/smith-providers",
    "crates/smith-cli",
    "crates/smith-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
smith-core = { path = "crates/smith-core" }
smith-providers = { path = "crates/smith-providers" }
smith-web = { path = "crates/smith-web" }

tokio = { version = "1.36", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "io-std",
    "fs",
    "process",
    "signal",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
# rustls, not native-tls: the development machine has no OpenSSL headers.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
clap = { version = "4.5", features = ["derive", "env"] }

# The web server's stack. This is the only place a browser-facing dependency is allowed.
# smith-core must stay free of it.
axum = { version = "0.8", features = ["json"] }
# Already in the tree via rustls. It is a direct dependency for the per-process bearer token.
getrandom = "0.2"
tower = { version = "0.5", features = ["util"] }

# `unsafe` is forbidden in every crate. A change that appears to need it requires a
# conversation with the developer, not a lint override.
[workspace.lints.rust]
unsafe_code = "forbid"
