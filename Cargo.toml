[workspace]
resolver = "2"
members = [
    "crates/smith-channel",
    "crates/smith-core",
    "crates/smith-providers",
    "crates/smith-sandbox",
    "crates/smith-worker",
    "crates/smith-cli",
    "crates/smith-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
smith-channel = { path = "crates/smith-channel" }
smith-core = { path = "crates/smith-core" }
smith-providers = { path = "crates/smith-providers" }
smith-sandbox = { path = "crates/smith-sandbox" }
smith-web = { path = "crates/smith-web" }
smith-worker = { path = "crates/smith-worker" }

tokio = { version = "1.36", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "io-std",
    "fs",
    "process",
    "signal",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
# rustls, not native-tls: the development machine has no OpenSSL headers.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
clap = { version = "4.5", features = ["derive", "env"] }

# Safe wrappers for the few process and descriptor operations the sandbox needs. Using `nix`
# keeps `unsafe` out of the tree, which the workspace lint forbids.
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "user"] }
# Maps the channel socketpair to descriptor 3 in the podman client. POSIX `sh` accepts only
# single-digit descriptor numbers in redirections, and the socket end is often above 9.
command-fds = { version = "0.3", features = ["tokio"] }
tempfile = "3"
# The project config is keyed by a hash of the canonical workspace root.
sha2 = "0.10"

# The web server's stack. This is the only place a browser-facing dependency is allowed.
# smith-core must stay free of it.
axum = { version = "0.8", features = ["json"] }
# Already in the tree via rustls. It is a direct dependency for the per-process bearer token.
getrandom = "0.2"
tower = { version = "0.5", features = ["util"] }

# `unsafe` is denied in every crate. One approved exception adopts the inherited channel
# descriptor in `smith-worker`; it carries an item-level allow and a SAFETY comment. A new
# exception is a policy change, not a lint override.
[workspace.lints.rust]
unsafe_code = "deny"
